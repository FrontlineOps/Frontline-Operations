<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FLO &#8226; Tactical support</title>
    <style>
      body {
        overflow: hidden;
      }
      .workspace {
        height: 84vh;
        display: grid;
        grid-template-columns: 66% 34%;
      }
      .map-portal {
        background: transparent;
      }
      .panel {
        border-left: 1px solid var(--line);
      }
      #request-button {
        width: 100%;
        margin: 0.7rem 0;
      }
      .packages {
        display: flex;
        gap: 0.4rem;
        margin: .5rem 0;
      }
      .packages button {
        flex: 1;
      }
      .costs {
        margin: .5rem 0;
      }
    </style>
  </head>
  <body class="map-layout">
    <header class="topbar">
      <div>
        <h1>Tactical support</h1>
        <small id="side-name">Connecting&#8230;</small>
      </div>
      <nav class="toolbar">
        <button data-event="mapPlayer">My position</button
        ><button data-event="mapTarget">Target</button
        ><button data-event="close">Close &#215;</button>
      </nav>
    </header>
    <main class="workspace">
      <section
        class="map-portal"
        aria-label="Click the Arma map to designate a target"
      ></section>
      <aside class="panel scroll">
        <div id="packages" class="packages"></div>
        <h2 id="package-name">Waiting for assets&#8230;</h2>
        <p id="package-description" class="muted"></p>
        <div id="costs" class="card"></div>
        <h2 id="target-grid">Click the map</h2>
        <p id="safety" class="notice warn"></p>
        <div id="readiness" class="notice" role="status"></div>
        <button id="request-button" class="primary" disabled>
          Request support
        </button>
        <details>
          <summary id="asset-summary">Assigned assets</summary>
          <div id="assets"></div>
        </details>
      </aside>
    </main>
    <footer class="footer">
      <span id="funds">Shared funds: waiting for report</span
      ><span id="freshness">Waiting for support state</span
      ><button data-event="refresh">Refresh</button>
    </footer>

    <script>
      (function () {
        function fail(error) {
          document.body.textContent =
            "This menu could not load. Close it with Escape and reopen it. " +
            error.message;
          document.body.style.cssText =
            "margin:2rem;background:#101c27;color:#fff;font:18px sans-serif";
        }
        function start() {
          window.FLOUIReady = FLOUILoad([
            "common.css",
            "common.js",
            "Support/support.js",
          ]);
          window.FLOUIReady.catch(fail);
        }
        if (window.A3API && typeof A3API.RequestFile === "function") {
          A3API.RequestFile("\\z\\flo\\addons\\main\\UI\\loader.js")
            .then(function (source) {
              const script = document.createElement("script");
              script.textContent = source;
              document.head.appendChild(script);
              start();
            })
            .catch(fail);
        } else {
          const script = document.createElement("script");
          script.src = "../loader.js";
          script.onload = start;
          script.onerror = function () {
            fail(new Error("Interface loader unavailable."));
          };
          document.head.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
