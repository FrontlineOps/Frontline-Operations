<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FLO Saved loadouts</title>
  </head>
  <body class="kits-dialog">
    <div id="loadouts" aria-labelledby="loadoutsTitle">
      <header class="kits-header">
        <h1 id="loadoutsTitle">Saved loadouts</h1>
        <nav aria-label="Loadout library">
          <button id="refreshButton" onclick="FLOKits.refresh()">Refresh</button>
          <button onclick="FLOKits.close()">Back to store</button>
        </nav>
      </header>
      <main class="kits-workspace">
        <aside class="kits-library" aria-label="Choose equipment">
          <input id="kit-search" type="search" aria-label="Search saved loadouts" placeholder="Search loadouts" oninput="FLOKits.filter(this.value)" />
          <button id="currentButton" class="kit-row" aria-pressed="true" onclick="FLOKits.current()">Current equipment</button>
          <div id="kitList" class="scroll" aria-label="Saved loadouts"></div>
        </aside>
        <section class="kits-detail" aria-labelledby="detailTitle">
          <header>
            <h2 id="detailTitle">Current equipment</h2>
            <span id="detailCount"></span>
          </header>
          <div id="detailList" class="scroll" tabindex="0" aria-label="Equipment contents"></div>
          <div id="selectionActions" hidden>
            <button id="deleteButton" onclick="FLOKits.removeSelected()">Delete</button>
            <button id="loadButton" class="primary" onclick="FLOKits.loadSelected()">Load into cart</button>
          </div>
        </section>
      </main>
      <section class="kits-save">
        <label for="kitName">Save current equipment as</label>
        <form onsubmit="FLOKits.saveCurrent(); return false;" novalidate>
          <input id="kitName" maxlength="40" placeholder="Loadout name" oninput="FLOKits.nameChanged()" aria-describedby="message" autocomplete="off" />
          <button id="saveButton" class="primary" type="submit" disabled>Save loadout</button>
        </form>
      </section>
      <div id="message" role="status" aria-live="polite"></div>
    </div>

    <script>
      (function () {
        function fail(error) {
          document.body.textContent =
            "This menu could not load. Close it with Escape and reopen it. " +
            error.message;
          document.body.style.cssText =
            "margin:2rem;background:#101c27;color:#fff;font:18px sans-serif";
        }
        function start() {
          window.FLOUIReady = FLOUILoad([
            "common.css",
            "common.js",
            "Store/kits.css",
            "Store/kits.js",
          ]);
          window.FLOUIReady.catch(fail);
        }
        if (window.A3API && typeof A3API.RequestFile === "function") {
          A3API.RequestFile("\\z\\flo\\addons\\main\\UI\\loader.js")
            .then(function (source) {
              const script = document.createElement("script");
              script.textContent = source;
              document.head.appendChild(script);
              start();
            })
            .catch(fail);
        } else {
          const script = document.createElement("script");
          script.src = "../loader.js";
          script.onload = start;
          script.onerror = function () {
            fail(new Error("Interface loader unavailable."));
          };
          document.head.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
