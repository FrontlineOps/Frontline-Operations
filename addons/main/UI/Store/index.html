<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FLO &#8226; Store</title>
  </head>
  <body class="arsenal-store">
    <main class="store-workspace">
      <nav id="categoryList" class="categories scroll" aria-label="Store categories"></nav>
      <section class="catalog" aria-label="Equipment list">
        <div class="catalog-tools">
          <h1>Base store</h1>
          <h2 id="categoryTitle">Equipment</h2>
          <input id="itemSearch" class="search" type="search" aria-label="Search equipment" placeholder="Search" oninput="FLOStore.filter(this.value)" />
        </div>
        <div id="itemList" class="item-list scroll" role="listbox" aria-label="Available equipment"></div>
        <div id="itemDetails" class="item-details scroll"></div>
      </section>
      <section class="preview-panel" aria-label="Equipment preview">
        <div id="previewViewport" class="preview-viewport" tabindex="0" aria-label="3D preview. Drag to rotate, scroll to zoom, or use the arrow and plus or minus keys."></div>
        <div class="preview-toolbar toolbar">
          <button id="characterMode" class="active" onclick="FLOStore.previewMode('character')">Character</button>
          <button id="equipmentMode" onclick="FLOStore.previewMode('equipment')">Equipment</button>
          <button onclick="FLOStore.previewControl({action:'reset'})" title="Reset preview camera">Reset</button>
        </div>
      </section>
      <aside class="cart-panel">
        <div class="cart-heading">
          <div class="row"><h2>Cart</h2><strong id="balance" title="Available shared funds">&#8212;</strong></div>
        </div>
        <div id="cartList" class="scroll"></div>
        <div class="checkout">
          <div class="row"><span>Items / cost</span><strong id="cartSummary">0 / $0</strong></div>
          <div class="row"><span>Supplies needed</span><strong id="cartSupply">0</strong></div>
          <div class="row"><span>Supplies available</span><strong id="throughput">&#8212;</strong></div>
          <p id="checkoutReason" class="error" role="status"></p>
          <div class="toolbar">
            <button onclick="FLOStore.clearCart()">Clear</button>
            <button id="checkoutButton" class="primary" onclick="FLOStore.checkout()" disabled>Purchase</button>
          </div>
        </div>
      </aside>
      <nav id="targetRow" class="destinations" aria-label="Equipment destination"></nav>
    </main>
    <footer class="footer">
      <div class="toolbar">
        <button onclick="FLOStore.close()">Close</button>
        <button onclick="FLOStore.openKits()">Loadouts</button>
        <button onclick="FLOStore.refresh()">Refresh</button>
      </div>
      <span id="message" role="status"></span>
    </footer>
    <div
      class="modal-backdrop hidden"
      id="attachmentModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="attachmentWeaponName"
    >
      <section class="attachment-modal">
        <h2 id="attachmentWeaponName">Included equipment</h2>
        <p id="attachmentWeaponMeta"></p>
        <strong id="attachmentWeaponPrice"></strong>
        <div id="attachmentList" class="scroll"></div>
        <div class="toolbar">
          <button onclick="FLOStore.cancelAttachmentAdd()">Cancel</button
          ><button class="primary" onclick="FLOStore.confirmAttachmentAdd()">
            Add weapon with attachments
          </button>
        </div>
      </section>
    </div>

    <script>
      (function () {
        function fail(error) {
          document.body.textContent =
            "This menu could not load. Close it with Escape and reopen it. " +
            error.message;
          document.body.style.cssText =
            "margin:2rem;background:#101c27;color:#fff;font:18px sans-serif";
        }
        function start() {
          window.FLOUIReady = FLOUILoad([
            "common.css",
            "Store/store.css",
            "common.js",
            "Store/store.js",
          ]);
          window.FLOUIReady.catch(fail);
        }
        if (window.A3API && typeof A3API.RequestFile === "function") {
          A3API.RequestFile("\\z\\flo\\addons\\main\\UI\\loader.js")
            .then(function (source) {
              const script = document.createElement("script");
              script.textContent = source;
              document.head.appendChild(script);
              start();
            })
            .catch(fail);
        } else {
          const script = document.createElement("script");
          script.src = "../loader.js";
          script.onload = start;
          script.onerror = function () {
            fail(new Error("Interface loader unavailable."));
          };
          document.head.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
